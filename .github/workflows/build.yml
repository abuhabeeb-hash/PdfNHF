name: Build PdfNHF

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Web App Files
        run: |
          mkdir -p build
          cp -r index.html build/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PdfNHF-App
          path: build/

